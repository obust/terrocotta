name: Set up Roc
description: Install the Roc nightly pinned by .roc-version

inputs:
  nightly-tag:
    description: Override .roc-version when testing a compiler update
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read Roc version
      id: version
      shell: bash
      env:
        OVERRIDE: ${{ inputs.nightly-tag }}
      run: |
        set -euo pipefail
        tag="${OVERRIDE:-$(tr -d '\r\n' < .roc-version)}"
        if [[ ! "$tag" =~ ^nightly-[0-9]{4}-([A-Za-z]+|[0-9]{2})-[0-9]{2}-[0-9a-f]{7,40}$ ]]; then
          echo "Invalid Roc nightly tag: $tag" >&2
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Validate package Roc version
      shell: bash
      env:
        EXPECTED: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        package_version="$(sed -nE 's/^[[:space:]]*roc: "([^"]+)",?$/\1/p' package/main.roc)"
        if [[ "$package_version" != "$EXPECTED" ]]; then
          echo "package/main.roc pins '$package_version'; expected '$EXPECTED' from .roc-version" >&2
          exit 1
        fi

    - name: Install Roc
      uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ steps.version.outputs.tag }}

    - name: Show Roc version
      shell: bash
      run: roc version
