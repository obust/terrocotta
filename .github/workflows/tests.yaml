name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build package archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc
      - name: Bundle package
        shell: bash
        run: scripts/bundle.sh --output-dir dist

  check:
    name: Check sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc
      - name: Check formatting and examples
        shell: bash
        run: scripts/check.sh

  test:
    name: Test package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc
      - name: Run package tests
        run: scripts/test.sh
