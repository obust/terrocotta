name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.2.0 or 0.2.0-rc1 (no v prefix)"
        required: true
        type: string
  pull_request:

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions: {}

jobs:
  build-bundle:
    name: Validate and prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
      bundle_filename: ${{ fromJson(steps.bundles.outputs.release_bundles)[0].artifact_file }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc

      - name: Require a branch for release follow-up PRs
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF_TYPE" = branch

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Run source checks
        run: scripts/check.sh

      - name: Run package tests
        run: scripts/test.sh

      - name: Require committed release notes
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: test -s "docs/release/$RELEASE_VERSION.md"

      - name: Resolve previous stable release
        id: previous
        if: github.event_name == 'workflow_dispatch'
        uses: roc-lang/release-package/actions/resolve-previous-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          github_token: ${{ github.token }}

      - name: Check API version bump
        uses: roc-lang/release-package/actions/run-bump-check@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ steps.validate.outputs.is_dry_run }}
          bump_check: ${{ steps.previous.outputs.previous_url != '' && 'require' || 'warn' }}
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Bundle package
        run: scripts/bundle.sh --output-dir dist

      - name: Prepare bundle metadata and test matrix
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-24.04","macos-26","windows-2025"]'

      - name: Require exactly one package archive
        run: jq -e 'length == 1' .release/release-bundles.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles/*.tar.zst
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            .release/release-bundles.json
            .release/test-matrix.json
            .release/bump-output.txt
          retention-days: 30
          if-no-files-found: error

  test-bundle:
    name: Test release archive (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-bundle.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/test-bundles
      - name: Test downloaded package archive
        uses: roc-lang/release-package/actions/test-bundle@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          test_bundle_command: python3 scripts/test_bundle_examples.py --bundle-path
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build-bundle.outputs.release_version }}

  create-release:
    name: Publish GitHub release
    needs: [build-bundle, test-bundle]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Prepare committed release notes
        uses: roc-lang/release-package/actions/make-release-notes@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          release_notes_command: cp "docs/release/$RELEASE_VERSION.md" "$RELEASE_NOTES_PATH"
          github_token: ${{ github.token }}

      - name: Add package import instructions
        env:
          RELEASE_VERSION: ${{ needs.build-bundle.outputs.release_version }}
          BUNDLE_FILENAME: ${{ needs.build-bundle.outputs.bundle_filename }}
        run: |
          alias="$(cat .package-alias)"
          bundle_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/$BUNDLE_FILENAME"
          printf '\n## Install\n\n```roc\n%s: "%s"\n```\n' "$alias" "$bundle_url" >> .release/release-notes.md

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          target: ${{ github.sha }}
          github_token: ${{ github.token }}

  test-published-examples:
    name: Test published examples (${{ matrix.os }})
    needs: [build-bundle, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-bundle.outputs.test_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-bundle.outputs.release_version }}/${{ needs.build-bundle.outputs.bundle_filename }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-roc
      - name: Update and validate examples against the published archive
        run: |
          python3 scripts/update_example_urls.py --bundle-url "$BUNDLE_URL"
          roc fmt --check examples
          python3 scripts/test_bundle_examples.py --bundle-url "$BUNDLE_URL"

  examples-pull-request:
    name: Propose published example URLs
    needs: [build-bundle, test-published-examples]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Update examples
        env:
          BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-bundle.outputs.release_version }}/${{ needs.build-bundle.outputs.bundle_filename }}
        run: python3 scripts/update_example_urls.py --bundle-url "$BUNDLE_URL"
      - name: Open or update example URL pull request
        uses: roc-lang/release-package/actions/create-followup-pr@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          paths: examples
          branch_prefix: codex/release-examples
          base_branch: ${{ github.ref_name }}
          commit_message: Update examples for ${{ needs.build-bundle.outputs.release_version }}
          pr_title: Update examples for ${{ needs.build-bundle.outputs.release_version }}
          pr_body: |
            Updates Terrocotta examples to use the published ${{ needs.build-bundle.outputs.release_version }} package archive.

            All examples passed against that archive on Linux, macOS, and Windows.
            See [validation](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          github_token: ${{ github.token }}
